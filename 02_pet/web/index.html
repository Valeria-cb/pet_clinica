<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha seu pet</title>
  <link rel="stylesheet" href="/02_pet/web/css/pet.css">
  <link rel="stylesheet" href="/css_padrao/global.css">
  


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header class="menu">

      <img class="menu-logo" src="/imgs_padrao/logo.svg" alt="petclinic">

      <nav class="progresso">
        <ul class="ind-progresso">
          <li><img src="/02_pet/web/img/pet01.svg" alt=""></li>
          <li><img src="/02_pet/web/img/profissional02.svg" alt=""><br></li>
          <li><img src="/02_pet/web/img/agendamento03.svg" alt=""></li>
          <li><img src="/02_pet/web/img/cadastro04.svg" alt=""></li>
          <li><img src="/02_pet/web/img/confirmacao05.svg" alt=""></li>
        </ul>
        
        <hr class="linha-continua">

      </nav>
    </header>

    <div class="texto-central">
      <h1>ESCOLHA O SEU PET</h1>
      <h4>Nos conte, qual é o seu pet?</h4>
    </div>

    <section class="conteudo-animais">
      <div>
        <ul class="animais">          
          <li id="img-cachorro"><img src="/02_pet/web/img/PG02_cachorro.svg" alt=""></li>
          <li id="img-cachorro2"><img src="/02_pet/web/img/PG02_cachorro-2.svg" alt=""></li>
          <li id="img-calopsita"><img src="/02_pet/web/img/PG02_calopsita.svg" alt=""></li>
          <li id="img-coelho"><img src="/02_pet/web/img/PG02_coelho.svg" alt=""></li>
          <li id="img-gato"><img src="/02_pet/web/img/PG02_gato.svg" alt=""></li>
          <li id="img-hamister"><img src="/02_pet/web/img/PG02_hamister.svg" alt=""></li>
          <li id="img-tartaruga"><img src="/02_pet/web/img/PG02_tartaruga.svg" alt=""></li>
        </ul>

      </div>
    </section>

    <footer class="botao-fluxo">
      <div class="botoes">
        <span id="circulo-botao-frente"></span>
        <button id="botao-cancelar">CANCELAR</button>
        <button id="botao-continuar">CONTINUAR</button>
      </div>
    </footer>
  </div>
</body>

</html>
