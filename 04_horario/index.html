<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha seu pet</title>
  <link rel="stylesheet" href="/04_horario/css/horario.css">
  <link rel="stylesheet" href="/css_padrao/global.css">



  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>

<body>
  <main class="container">

    <header class="menu">
      <img class="menu-logo" src="/imgs_padrao/logo.svg" alt="petclinic">
      <nav class="progresso">
        <ul class="ind-progresso">
          <li><img src="/imgs_padrao/pet01_claro.svg" alt=""></li>
          <li><img src="/imgs_padrao/profissional02_claro.svg" alt=""><br></li>
          <li><img src="/imgs_padrao/agendamento03_verde.svg" alt=""></li>
          <li><img src="/imgs_padrao/cadastro04_claro.svg" alt=""></li>
          <li><img src="/imgs_padrao/confirmacao05_claro.svg" alt=""></li>
        </ul>

        <hr class="linha-continua">

      </nav>
    </header>

    <div class="texto-central_02">
      <h1>ESCOLHA O SEU<br>DIA E HORÁRIO</h1>
      <p class="p1">ESCOLHA A MELHOR DATA PARA SEU ATENDIMENTO
      <p>
    </div>

    <img class="img-inicial" src="/04_horario/img/imagem01.svg" alt="">

    <section>

      <div id="seta-hora">
        <button class="seta-esquerda"></button>
        <button class="seta-direita"></button>
      </div>

      <div class="horario">
        <div class="lista-hora">
          <div class="hora-container">
            <button class="hora">09:00</button>
            <button class="hora">09:30</button>
            <button class="hora">10:00</button>
            <button class="hora">10:30</button>
            <button class="hora">11:00</button>
            <button class="hora">11:30</button>
            <button class="hora">12:00</button>
            <button class="hora">12:30</button>
            <button class="hora">13:00</button>
            <button class="hora">13:30</button>
            <button class="hora">14:00</button>
            <button class="hora">14:30</button>
          </div>
        </div>
      </div>

    </section>

    <footer>
      <div class="botoes">
        <span id="circulo-botao"></span>
        <button id="botao-cancelar">CANCELAR</button>
        <span id="circulo-botao2"></span>
        <button id="botao-continuar">CONTINUAR</button>
      </div>
    </footer>

  </main>
</body>

</html>
